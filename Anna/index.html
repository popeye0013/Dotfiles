<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffdf9">
  <title>Happy Birthday Annammaaa ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="photo-collage" aria-label="Birthday photo collage">
      <div class="tile small t1"><img alt="Memory 1"></div>
      <div class="tile small t2"><img alt="Memory 2"></div>
      <div class="tile large t3"><img alt="Memory 3"></div>
      <div class="tile small t4"><img alt="Memory 4"></div>
      <div class="tile small t5"><img alt="Memory 5"></div>
      <div class="tile small t6"><img alt="Memory 6"></div>
      <div class="tile small t7"><img alt="Memory 7"></div>
      <div class="tile small t8"><img alt="Memory 8"></div>
      <div class="tile small t9"><img alt="Memory 9"></div>
      <div class="tile small t10"><img alt="Memory 10"></div>
      <div class="tile small t11"><img alt="Memory 11"></div>
      <div class="tile wide t12"><img alt="Memory 12"></div>
      <div class="tile small t13"><img alt="Memory 13"></div>
      <div class="tile small t14"><img alt="Memory 14"></div>
      <div class="tile small t15"><img alt="Memory 15"></div>
      <div class="tile small t16"><img alt="Memory 16"></div>
      <span class="sticker star" aria-hidden="true">☆</span>
      <span class="sticker heart" aria-hidden="true">♥</span>
    </section>

    <section class="message">
      <h1>Happy Birthday Annammaaa <span class="melting" aria-label="melting face">🫠</span></h1>
      <p class="date">21 <span>❤️</span> 11 <span>❤️</span> 2002</p>
      <p class="wish">Happy birthday! I won't pretend I haven't been thinking about you all day (okay, all week). Have the best one!</p>
      <p class="hint">Tap any photo tile to add your own picture ✨</p>
    </section>
  </main>
  <input id="photo-picker" type="file" accept="image/*" hidden>
  <script src="script.js"></script>
</body>
</html>
